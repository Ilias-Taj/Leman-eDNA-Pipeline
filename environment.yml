# environment.yml
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- Python & Base Tools ---
  - python=3.10
  - mamba
  - pip
  - unzip

  # --- Bioinformatics Tools ---
  - filtlong              # Quality filtering for long reads
  - vsearch              # Clustering, chimera detection, SINTAX taxonomy
  - samtools             # SAM/BAM file processing
  - cutadapt             # Primer trimming (step 2b)

  # --- Python Data Science Packages ---
  - biopython            # BLAST interface (script 6)
  - pandas               # Data manipulation (scripts 4, 5, 7)
  - matplotlib           # Plotting (analysis notebooks)
  - seaborn              # Statistical visualizations (notebooks)
  - ipykernel            # Jupyter notebook kernel
  - numpy               # Numerical operations

  # --- Pip Packages ---
  - pip:
      - biopython
